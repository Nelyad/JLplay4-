name: Compilar JLplay4 APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master- name: Preparar Java

  - name: Buscar ZIP
    run: |
      find . -maxdepth 3 -type f -name '*.zip'

  - name: Extraer proyecto
    run: |
      mkdir -p proyecto
      unzip -o JLplay4_Android_Starter_v2.zip -d proyecto
      find proyecto -type f -name settings.gradle.kts

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Compilar APK
    run: |
      cd proyecto
      GRADLE_FILE="$(find . -name settings.gradle.kts -print -quit)"
      if [ -z "$GRADLE_FILE" ]; then
        echo "No se encontró settings.gradle.kts dentro del ZIP"
        exit 1
      fi
      cd "$(dirname "$GRADLE_FILE")"
      gradle assembleDebug

  - name: Guardar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JLplay4-APK
      path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
