name: Compilar JLplay4 APK

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar repositorio
uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extraer proyecto Android
    run: |
      unzip JLplay4_Android_Starter_v2.zip
      cd JLplay4_Android_Starter
      echo "Proyecto extraído correctamente"

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Compilar APK
    run: |
      cd JLplay4_Android_Starter
      gradle assembleDebug

  - name: Guardar APK compilada
    uses: actions/upload-artifact@v4
    with:
      name: JLplay4-APK
      path: JLplay4_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
