 - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Ver archivos del repositorio
    run: |
      ls -la
      unzip -l JLplay4_Android_Starter_v2.zip

  - name: Extraer proyecto
    run: |
      unzip -o JLplay4_Android_Starter_v2.zip -d proyecto
      find proyecto -name settings.gradle.kts -print
      find proyecto -name build.gradle.kts -print

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Compilar APK
    run: |
      cd proyecto
      PROJECT_DIR="$(find . -name settings.gradle.kts -printf '%h\n' | head -n 1)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "No se encontró settings.gradle.kts"
        exit 1
      fi
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Guardar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JLplay4-APK
      path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
